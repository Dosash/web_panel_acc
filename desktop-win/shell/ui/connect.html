<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TG Panel — подключение</title>
<!-- Выбор режима (desktop/connection.py): на этом компьютере или на своём сервере. Оболочка подставляет __CONNECT__
     ({mode, url}) и отвечает на «connect» сообщением {type: "check", error} — проверка, что по адресу TG Panel. -->
<style>
  :root { --bg: #0b1220; --surface: #0f1829; --elev: #141f36; --text: #e7eef9; --muted: #8796b3; --accent: #4f8cff;
    --accent-soft: rgb(79 140 255 / .16); --border: rgb(148 163 184 / .14); --border-strong: rgb(148 163 184 / .24);
    --danger: #f2555a; color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #eef2f8; --surface: #ffffff; --elev: #ffffff; --text: #0f172a; --muted: #64748b;
      --accent-soft: rgb(79 140 255 / .12); --border: rgb(15 23 42 / .08); --border-strong: rgb(15 23 42 / .16);
      --danger: #e03e43; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; padding: 22px 24px 18px; gap: 12px; user-select: none; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); transition: border-color .15s, background .15s; }
  .opt:hover { border-color: var(--border-strong); }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .opt input { margin: 3px 0 0; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
  .opt b { font-weight: 600; display: block; }
  .opt span { color: var(--muted); font-size: 13px; }
  .url { width: 100%; font: inherit; color: var(--text); background: var(--elev); border: 1px solid var(--border-strong);
    border-radius: 10px; padding: 9px 12px; outline: none; user-select: text; }
  .url:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .url:disabled { opacity: .5; }
  .error { min-height: 20px; color: var(--danger); font-size: 13px; word-break: break-word; user-select: text; }
  .error.info { color: var(--muted); }
  .buttons { margin-top: auto; display: flex; justify-content: flex-end; gap: 10px; }
  button { font: inherit; border-radius: 10px; padding: 8px 18px; cursor: pointer; border: 1px solid var(--border-strong);
    background: var(--elev); color: var(--text); }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  button:disabled { opacity: .6; cursor: default; }
  button:hover:not(:disabled) { filter: brightness(1.08); }
</style>
</head>
<body>
<h1>Где работают ваши Telegram-аккаунты?</h1>
<label class="opt"><input type="radio" name="mode" value="local">
  <div><b>На этом компьютере</b><span>Аккаунты подключаются прямо из программы. Сообщения приходят, пока программа запущена.</span></div>
</label>
<label class="opt"><input type="radio" name="mode" value="remote">
  <div><b>На моём сервере с TG Panel</b><span>Программа открывает вашу веб-панель: аккаунты, папки и любые изменения панели — одни и те же на всех устройствах.</span></div>
</label>
<input class="url" id="url" placeholder="Адрес панели, например http://192.168.1.10/accounts/" spellcheck="false" autocomplete="off">
<div class="error" id="error"></div>
<div class="buttons">
  <button id="cancel">Отмена</button>
  <button id="ok" class="primary">Продолжить</button>
</div>
<script>
  const C = __CONNECT__;
  const $ = id => document.getElementById(id);
  const radios = [...document.querySelectorAll("input[name=mode]")];
  const post = msg => window.chrome.webview.postMessage("tg-desktop:" + JSON.stringify(msg));
  const mode = () => radios.find(r => r.checked)?.value || "local";
  const sync = () => {
    $("url").disabled = mode() !== "remote";
    if (mode() === "remote") $("url").focus();
    $("error").textContent = "";
  };
  $("url").value = C.url || "";
  radios.find(r => r.value === (C.mode === "remote" ? "remote" : "local")).checked = true;
  radios.forEach(r => r.addEventListener("change", sync));
  sync();
  const busy = on => { $("ok").disabled = on; $("url").readOnly = on; };
  $("ok").onclick = () => {
    if (mode() === "remote" && !$("url").value.trim()) { $("error").textContent = "Укажите адрес панели"; return; }
    $("error").className = "error info";
    $("error").textContent = mode() === "remote" ? "Проверяем…" : "";
    busy(true);
    post({ type: "connect", mode: mode(), url: $("url").value });
  };
  $("cancel").onclick = () => post({ type: "connect-cancel" });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && !$("ok").disabled) $("ok").click();
    if (e.key === "Escape") $("cancel").click();
  });
  window.chrome.webview.addEventListener("message", e => {
    const m = e.data || {};
    if (m.type !== "check") return;
    busy(false);
    $("error").className = "error";
    $("error").textContent = m.error || "";
    if (m.url) $("url").value = m.url;
  });
  document.addEventListener("contextmenu", e => { if (e.target.id !== "url") e.preventDefault(); });
</script>
</body>
</html>
