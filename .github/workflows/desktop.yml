# Сборка десктоп-приложения под Linux, Windows и macOS (Apple Silicon и Intel).
# Запуск: тег v* (файлы прикрепляются к релизу), вручную (Actions → «Десктоп-приложение» → Run workflow)
# или правки в том, что входит в программу (desktop/, app/, static/, requirements.txt). Готовые файлы — в артефактах запуска.
name: Десктоп-приложение

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["desktop/**", "app/**", "static/**", "requirements.txt", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "app/**", "static/**", "requirements.txt", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-22.04 }   # старый glibc — сборка запустится на большинстве дистрибутивов
          - { name: Windows x64, os: windows-2022 }
          - { name: macOS Apple Silicon, os: macos-14 }
          - { name: macOS Intel, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            desktop/requirements.txt

      - name: Системные библиотеки Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-cursor0 libxcb-xkb1 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libxkbfile1 libegl1 libgl1 libfontconfig1 libdbus-1-3 libasound2 \
            libglib2.0-0 file
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt

      - name: Сборка
        run: python desktop/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: TG-Panel-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/release/*.tar.gz
            desktop/release/*.AppImage
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.dmg
          if-no-files-found: error

  release:
    name: Файлы к релизу
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
