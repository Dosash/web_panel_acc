# Сборка десктоп-приложения под Linux, Windows и macOS (Apple Silicon и Intel).
# Linux и macOS — PyQt5 из desktop/ (desktop/build.py), Windows — Tauri + WebView2 из desktop-win/ (build.ps1).
# Запуск: правки в том, что входит в программу (desktop/, desktop-win/, app/, bots/, static/, requirements.txt),
# тег v* или вручную (Actions → «Десктоп-приложение» → Run workflow). Готовые файлы — в артефактах запуска.
#
# Релиз: если в main пришла новая версия (VERSION в app/config.py, тега vВЕРСИЯ ещё нет) или запушен тег v*,
# создаётся релиз GitHub с файлами под все системы, файлом контрольных сумм TG-Panel-<версия>-SHA256SUMS.txt
# и описанием из CHANGELOG.md. Установленные программы находят его сами и обновляются (desktop/updater.py,
# desktop-win/shell/src/updater.rs — программа для Windows без совпавшей суммы обновление не ставит).
name: Десктоп-приложение

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["desktop/**", "desktop-win/**", "app/**", "bots/**", "static/**", "requirements.txt",
            ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "desktop-win/**", "app/**", "bots/**", "static/**", "requirements.txt",
            ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  version:
    name: Версия
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^VERSION = "([^"]+)"/\1/p' app/config.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] \
               && ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            publish=true  # новая версия в main — выпускаем
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Версия $version, релиз: $publish"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-22.04 }   # старый glibc — сборка запустится на большинстве дистрибутивов
          - { name: Windows x64, os: windows-2022 }
          - { name: macOS Apple Silicon, os: macos-14 }
          - { name: macOS Intel, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            desktop/requirements.txt
            desktop-win/server/requirements.txt

      - name: Системные библиотеки Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-cursor0 libxcb-xkb1 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libxkbfile1 libegl1 libgl1 libfontconfig1 libdbus-1-3 libasound2 \
            libglib2.0-0 file
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш Rust (Windows)
        if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-win/shell

      - name: Tauri CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) { cargo install tauri-cli --version "^2" --locked }

      - name: Зависимости
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt

      - name: Сборка
        if: runner.os != 'Windows'
        run: python desktop/build.py

      - name: Сборка (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop-win/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: TG-Panel-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/release/*.tar.gz
            desktop/release/*.AppImage
            desktop/release/*.dmg
            desktop-win/release/*.zip
            desktop-win/release/*.exe
          if-no-files-found: error

  release:
    name: Релиз
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Описание из CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(os.environ['VERSION'])}\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          body = m.group(1).strip() if m else ""
          body += "\n\n**Скачать:** Windows — `setup.exe` (или `portable.zip`), Linux — `.AppImage` (или `.tar.gz`), " \
                  "macOS — `.dmg` (arm64 — Apple Silicon, x86_64 — Intel). Установленные программы обновятся сами."
          open("release-notes.md", "w", encoding="utf-8").write(body)
          PY
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Контрольные суммы
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd release
          sha256sum TG-Panel-* > "TG-Panel-$VERSION-SHA256SUMS.txt"
          cat "TG-Panel-$VERSION-SHA256SUMS.txt"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TG Panel ${{ needs.version.outputs.version }}
          body_path: release-notes.md
          files: release/*
          fail_on_unmatched_files: true
          make_latest: true
