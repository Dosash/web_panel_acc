# TG Panel — веб-панель для Telegram-аккаунтов (один контейнер).
# Сеть хоста: панель слушает WEB_HOST:WEB_PORT прямо на сервере (по умолчанию 127.0.0.1:8080 —
# доступна только с самого сервера; как открыть её — см. README, раздел «Доступ к панели»).
services:
  tg-panel:
    build: .
    image: tg-panel:latest
    container_name: tg-panel
    restart: unless-stopped
    # встроенный бот постинга даёт идущим публикациям до ~72 с на завершение (app/bots.py)
    stop_grace_period: 90s
    network_mode: host
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      # кнопка «Обновить панель»: через Docker панель запускает помощник с git pull и docker compose up --build
      # (app/updates.py). Доступ к Docker — это права root на сервере; без кнопки — уберите строку
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
